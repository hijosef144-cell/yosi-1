# Netlify configuration file
# This file configures how Netlify builds and deploys your site

# Build settings
[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  
# Redirect rules (optional)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Headers for security (optional)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Enable Netlify Identity and Git Gateway
[build.environment]
  NODE_VERSION = "24"

# Plugin configuration (for Netlify CMS)
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# ---- Kaspchem (added) -------------------------------------------------------
[[redirects]]
  from = "/api/kaspchem/config"
  to = "/.netlify/functions/kaspchem-config"
  status = 200

[[redirects]]
  from = "/api/kaspchem/lead"
  to = "/.netlify/functions/kaspchem-lead"
  status = 200

[[redirects]]
  from = "/kaspchem/check/*"
  to = "/kaspchem/check.html"
  status = 200

[[headers]]
  for = "/kaspchem/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/kaspchem/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/kaspchem/*"
  [headers.values]
    Cache-Control = "no-store"

# ---- internal files: never served publicly (publish dir is the repo root) ----
[[redirects]]
